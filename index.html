<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>同時配布エリア選択 - 情報誌くれよん</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F97316'/%3E%3Cpath d='M9 22V10l7 5 7-5v12' fill='none' stroke='white' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <p class="eyebrow">情報誌くれよん　同時配布</p>
    <h1>配布エリア選択</h1>
    <nav class="area-tabs" id="areaTabs" aria-label="エリアの切り替え"></nav>
    <p class="lead">地図の区画をタップすると、配布可能部数と配布料金を自動で計算します。下の一覧からも選べます。<a href="map.html">実際の地図で選ぶ（試作・西区・北区）</a></p>
  </div>
</header>

<main class="wrap layout">

  <!-- 地図 -->
  <section class="map-card" aria-label="配布エリアの地図">
    <div class="map-toolbar">
      <div class="map-tabs" id="mapTabs" aria-label="地図の切り替え"></div>
      <div class="legend" id="legend"></div>
      <div class="zoom">
        <button type="button" id="zoomOut" aria-label="地図を縮小">－</button>
        <button type="button" id="zoomReset">全体</button>
        <button type="button" id="zoomIn" aria-label="地図を拡大">＋</button>
      </div>
    </div>
    <div class="map-scroll" id="mapScroll">
      <svg id="map" role="group" aria-label="区画（クリックで選択）"></svg>
    </div>
    <div class="map-tip" id="mapTip" hidden></div>
  </section>

  <!-- 集計・料金 -->
  <aside class="side">
    <section class="card summary" aria-live="polite">
      <div class="sum-row">
        <div>
          <p class="sum-label">合計部数</p>
          <p class="sum-big"><span id="totalCopies">0</span><small>部</small></p>
        </div>
        <div class="sum-sub">
          <p><span id="selCount">0</span> 区画を選択中</p>
          <p class="ward-sub" id="wardSub"></p>
        </div>
      </div>

      <div class="price">
        <h2>配布料金の計算</h2>
        <div class="price-grid">
          <label>チラシサイズ
            <select id="size">
              <option>A4</option><option>B4</option><option>A3</option><option>B3</option><option>A2</option>
            </select>
          </label>
          <label>折加工
            <select id="fold"><option value="0">不要</option><option value="1">必要</option></select>
          </label>
          <label>挟み込み配布
            <select id="insert"><option value="0">不要</option><option value="1">必要</option></select>
          </label>
        </div>
        <dl class="price-lines">
          <div><dt>サイズ単価</dt><dd><span id="unitSize">7.0</span>円</dd></div>
          <div id="foldLine" hidden><dt>折加工</dt><dd>＋<span id="unitFold">0</span>円</dd></div>
          <div id="insertLine" hidden><dt>挟み込み</dt><dd>＋<span id="unitInsert">0</span>円</dd></div>
          <div class="unit-total"><dt>1部あたり</dt><dd><span id="unitTotal">7.0</span>円</dd></div>
        </dl>
        <p class="fee">配布料金（税別）<strong><span id="fee">0</span>円</strong></p>
        <p class="note">単価は合計部数で変わります（5,000部未満／1万部未満／3万部未満／3万部以上）。</p>
      </div>

      <div class="actions">
        <button type="button" class="btn-primary" id="copyBtn">選択内容をコピー</button>
        <button type="button" class="btn-ghost" id="shareBtn">このURLを共有</button>
      </div>
      <p class="copied" id="copied" hidden></p>
    </section>
  </aside>

  <!-- 一覧 -->
  <section class="card list-card" aria-label="区画の一覧">
    <div class="list-head">
      <h2>区画一覧</h2>
      <div class="bulk" id="bulk"></div>
    </div>
    <div class="tables" id="tables"></div>
    <p class="source">部数データ：<span id="source"></span></p>
  </section>

</main>

<!-- スマホ用：画面下に合計を固定表示 -->
<div class="sticky-total" id="stickyTotal">
  <span><b id="stickyCopies">0</b>部</span>
  <span class="sep">／</span>
  <span>料金 <b id="stickyFee">0</b>円（税別）</span>
</div>

<footer class="site-footer">© 2026 株式会社ケイ・クリエイト　情報誌くれよん</footer>

<script src="data/seihoku.js"></script>
<script src="data/inazawa.js"></script>
<script src="price.js"></script>
<script src="app.js"></script>
</body>
</html>
